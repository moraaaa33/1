<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دار الرحمان - لوحة المعلم والإدارة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .font-quran { font-family: 'Amiri', serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-3 sm:p-6">

    <!-- نافذة كلمة سر المعلم (Password Lock) -->
    <div id="teacherLockModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-sm w-full text-center space-y-4">
            <div class="w-16 h-16 bg-amber-100 text-amber-800 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">
                🔒
            </div>
            <h2 class="text-lg font-bold text-slate-800">دخول لوحة المعلم</h2>
            <p class="text-xs text-slate-500">يرجى إدخال كلمة سر الإدارة للمتابعة</p>
            <input type="password" id="teacherPassInput" placeholder="أدخل كلمة السر" class="w-full px-4 py-2.5 border rounded-xl text-center text-sm outline-none focus:ring-2 focus:ring-amber-500">
            <button onclick="checkTeacherPassword()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-xl text-sm transition">
                دخول اللوحة 🚀
            </button>
            <a href="index.html" class="block text-xs text-slate-400 hover:text-slate-600">العودة للرئيسية</a>
        </div>
    </div>

    <!-- Header -->
    <header class="max-w-4xl mx-auto bg-white rounded-2xl shadow-md p-4 mb-6 border-r-4 border-amber-600 flex justify-between items-center flex-wrap gap-3">
        <div class="flex items-center gap-3">
            <img src="teacher.jpeg" alt="صورة المعلم" class="w-14 h-14 rounded-full object-cover border-2 border-amber-600 shadow-md">
            <div>
                <h1 class="text-xl font-bold text-slate-800 font-quran">لوحة تحكم المعلم وإدارة الاختبارات</h1>
                <p class="text-xs text-slate-500">دار الرحمان لتحفيظ القرآن الكريم</p>
            </div>
        </div>
        <a href="index.html" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3 py-2 rounded-xl transition">
            🏠 العودة لبوابة الطالب
        </a>
    </header>

    <main class="max-w-4xl mx-auto space-y-6">

        <!-- Add New Exam Section -->
        <div class="bg-white rounded-2xl shadow-md p-5 sm:p-6 border border-slate-200">
            <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                <span>➕</span>
                <span>إضافة اختبار جديد</span>
            </h2>

            <form onsubmit="handleCreateExam(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">عنوان الاختبار / المادة</label>
                        <input type="text" id="examSubject" required placeholder="مثال: اختبار تجويد - جزء عم" class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">الصف الدراسي</label>
                        <select id="examGrade" required class="w-full px-3 py-2 border rounded-xl text-xs bg-white focus:ring-2 focus:ring-amber-500 outline-none">
                            <option value="">اختر الصف...</option>
                            <optgroup label="مرحلة الأطفال والبراعم">
                                <option value="مرحلة الأطفال والبراعم">مرحلة الأطفال والبراعم</option>
                            </optgroup>
                            <optgroup label="المرحلة الابتدائية">
                                <option value="الصف الأول الابتدائي">الصف الأول الابتدائي</option>
                                <option value="الصف الثاني الابتدائي">الصف الثاني الابتدائي</option>
                                <option value="الصف الثالث الابتدائي">الصف الثالث الابتدائي</option>
                                <option value="الصف الرابع الابتدائي">الصف الرابع الابتدائي</option>
                                <option value="الصف الخامس الابتدائي">الصف الخامس الابتدائي</option>
                                <option value="الصف السادس الابتدائي">الصف السادس الابتدائي</option>
                            </optgroup>
                            <optgroup label="المرحلة الإعدادية">
                                <option value="الصف الأول الإعدادي">الصف الأول الإعدادي</option>
                                <option value="الصف الثاني الإعدادي">الصف الثاني الإعدادي</option>
                                <option value="الصف الثالث الإعدادي">الصف الثالث الإعدادي</option>
                            </optgroup>
                            <optgroup label="المرحلة الثانوية">
                                <option value="الصف الأول الثانوي">الصف الأول الثانوي</option>
                                <option value="الصف الثاني الثانوي">الصف الثاني الثانوي</option>
                                <option value="الصف الثالث الثانوي">الصف الثالث الثانوي</option>
                            </optgroup>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">مدة الاختبار (بالدقائق)</label>
                        <input type="number" id="examDuration" required min="5" placeholder="مثال: 30" class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                </div>

                <!-- Questions Builder -->
                <div class="border-t pt-4">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-xs font-bold text-slate-700">أسئلة الاختبار</h3>
                        <button type="button" onclick="addQuestionField()" class="bg-amber-100 text-amber-800 hover:bg-amber-200 text-xs font-bold px-3 py-1.5 rounded-lg transition">
                            + إضافة سؤال
                        </button>
                    </div>
                    <div id="questionsContainer" class="space-y-3"></div>
                </div>

                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-xl transition shadow text-xs sm:text-sm">
                    حفظ ونشر الاختبار ✨
                </button>
            </form>
        </div>

        <!-- Registered Students Section -->
        <div class="bg-white rounded-2xl shadow-md p-5 sm:p-6 border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <span>👥</span>
                    <span>الطلاب المسجلون بالنظام (من Firebase)</span>
                </h2>
                <button onclick="loadStudentsFromFirebase()" class="text-xs bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold px-3 py-1.5 rounded-lg transition">
                    🔄 تحديث وقراءة البيانات
                </button>
            </div>
            <div id="studentsListContainer" class="overflow-x-auto">
                <p class="text-xs text-slate-400 text-center py-4">اضغط على زر التحديث لقراءة الطلاب سحابياً...</p>
            </div>
        </div>

    </main>

    <!-- Logic Script -->
    <script>
        let questionCount = 0;

        // كلمة سر معلم النظام (تم التحديث إلى 2906)
        function checkTeacherPassword() {
            const pass = document.getElementById('teacherPassInput').value;
            if (pass === '2906') { 
                document.getElementById('teacherLockModal').classList.add('hidden');
                loadStudentsFromFirebase();
            } else {
                alert("❌ كلمة السر غير صحيحة!");
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            addQuestionField();
        });

        function addQuestionField() {
            questionCount++;
            const container = document.getElementById('questionsContainer');
            const qDiv = document.createElement('div');
            qDiv.className = "p-3.5 bg-slate-50 border border-slate-200 rounded-xl space-y-2 relative";
            qDiv.id = `q_block_${questionCount}`;

            qDiv.innerHTML = `
                <div class="flex justify-between items-center gap-2">
                    <span class="text-xs font-bold text-amber-800">سؤال ${questionCount}</span>
                    <button type="button" onclick="removeQuestionField('${qDiv.id}')" class="text-red-500 hover:text-red-700 text-xs font-bold">حذف ❌</button>
                </div>
                <input type="text" required placeholder="نص السؤال..." class="q-text w-full px-3 py-1.5 border rounded-lg text-xs outline-none">
                <div class="grid grid-cols-2 gap-2">
                    <select class="q-type w-full px-2 py-1.5 border rounded-lg text-xs bg-white">
                        <option value="mcq">اختيار من متعدد</option>
                        <option value="tf">صح أو خطأ</option>
                        <option value="text">مقالي / أكمل</option>
                    </select>
                    <input type="text" placeholder="الإجابة النموذجية الصحيحة" class="q-correct w-full px-3 py-1.5 border rounded-lg text-xs outline-none">
                </div>
            `;
            container.appendChild(qDiv);
        }

        function removeQuestionField(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        async function handleCreateExam(event) {
            event.preventDefault();
            const subject = document.getElementById('examSubject').value;
            const grade = document.getElementById('examGrade').value;
            const duration = document.getElementById('examDuration').value;

            const qBlocks = document.querySelectorAll('#questionsContainer > div');
            const questions = [];

            qBlocks.forEach(block => {
                questions.push({
                    qText: block.querySelector('.q-text').value,
                    type: block.querySelector('.q-type').value,
                    correctAnswer: block.querySelector('.q-correct').value
                });
            });

            const newExam = {
                subject: subject,
                grade: grade,
                duration: duration,
                questions: questions,
                createdAt: new Date().toISOString()
            };

            if (window.saveExamToFirebase) {
                await window.saveExamToFirebase(newExam);
                alert("🎉 تم نشر الاختبار وسيعرض للطلاب فوراً!");
                location.reload();
            }
        }

        async function loadStudentsFromFirebase() {
            const container = document.getElementById('studentsListContainer');
            container.innerHTML = `<p class="text-xs text-amber-700 text-center py-4">جاري تحميل قائمة الطلاب من الفايربيز...</p>`;

            if (window.fetchStudentsFromFirebase) {
                const students = await window.fetchStudentsFromFirebase();
                if (students.length === 0) {
                    container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">لا يوجد طلاب مسجلون حالياً.</p>`;
                    return;
                }

                let html = `
                    <table class="w-full text-right text-xs border-collapse">
                        <thead>
                            <tr class="bg-amber-100 text-amber-900">
                                <th class="p-2.5 border border-amber-200">الاسم</th>
                                <th class="p-2.5 border border-amber-200">الصف الدراسي</th>
                                <th class="p-2.5 border border-amber-200">هاتف الطالب</th>
                                <th class="p-2.5 border border-amber-200">هاتف ولي الأمر</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                students.forEach(s => {
                    html += `
                        <tr class="border-b hover:bg-amber-50/50">
                            <td class="p-2.5 border font-bold text-slate-800">${s.name}</td>
                            <td class="p-2.5 border text-slate-600">${s.grade}</td>
                            <td class="p-2.5 border text-slate-600" dir="ltr">${s.phone}</td>
                            <td class="p-2.5 border text-slate-600" dir="ltr">${s.parentPhone}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                container.innerHTML = html;
            }
        }
    </script>

    <!-- Firebase SDK Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOpetcxMlTHXmK-A8L9qkA2LqZ7cur7pU",
            authDomain: "dar-alrhman.firebaseapp.com",
            databaseURL: "https://dar-alrhman-default-rtdb.firebaseio.com",
            projectId: "dar-alrhman",
            storageBucket: "dar-alrhman.firebasestorage.app",
            messagingSenderId: "626775344339",
            appId: "1:626775344339:web:f0ade6c34533726dd9c026"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // قراءة قائمة الطلاب سحابياً من Firestore
        window.fetchStudentsFromFirebase = async function() {
            try {
                const querySnapshot = await getDocs(collection(db, "students"));
                const list = [];
                querySnapshot.forEach((doc) => {
                    list.push(doc.data());
                });
                return list;
            } catch (e) {
                console.error("خطأ قراءة البيانات: ", e);
                return [];
            }
        };

        // حفظ اختبار جديد
        window.saveExamToFirebase = async function(examData) {
            try {
                await addDoc(collection(db, "exams"), examData);
            } catch (e) {
                console.error("خطأ حفظ الاختبار: ", e);
            }
        };
    </script>
</body>
</html>
