<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دار الرحمان لتحفيظ القرآن الكريم - بوابة الطالب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .font-quran { font-family: 'Amiri', serif; }
        .watermark-bg {
            position: relative;
            overflow: hidden;
        }
        .watermark-bg::before {
            content: "";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 250px; height: 250px;
            background-image: url('logo.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            border-radius: 50%;
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
            mix-blend-mode: multiply;
        }
        .watermark-bg > * { position: relative; z-index: 1; }
    </style>
</head>
<body class="bg-emerald-950/5 min-h-screen flex flex-col justify-between p-3 sm:p-5 relative">

    <!-- Header -->
    <header class="text-center my-4 sm:my-6">
        <div class="flex justify-center items-center gap-3 mb-2">
            <img src="teacher.jpeg" alt="صورة المعلم" class="w-16 h-16 rounded-full object-cover border-2 border-emerald-600 shadow-md">
            <div class="text-right">
                <h1 class="text-2xl sm:text-3xl font-bold text-emerald-800 font-quran">دار الرحمان لتحفيظ القرآن الكريم</h1>
                <p class="text-xs text-amber-700 font-semibold tracking-wide">منصة الاختبارات الشرعية والقرآنية</p>
            </div>
        </div>
        <div class="w-32 h-1 bg-gradient-to-r from-transparent via-amber-500 to-transparent mx-auto mt-2 rounded-full"></div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md w-full mx-auto bg-white rounded-2xl shadow-2xl p-6 border border-emerald-100 watermark-bg">
        
        <!-- Auth Tabs -->
        <div id="authTabs" class="flex border-b mb-6 border-slate-200">
            <button id="tabLoginBtn" onclick="switchAuthMode('login')" class="flex-1 py-2.5 text-center font-bold text-emerald-700 border-b-2 border-emerald-600 transition text-sm sm:text-base">تسجيل الدخول</button>
            <button id="tabRegisterBtn" onclick="switchAuthMode('register')" class="flex-1 py-2.5 text-center font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition text-sm sm:text-base">حساب جديد (أول مرة)</button>
        </div>

        <!-- Login -->
        <div id="sectionLogin">
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">رقم هاتف الطالب</label>
                    <input type="tel" id="loginPhone" required placeholder="01xxxxxxxxx" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:outline-none text-left" dir="ltr">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">كلمة السر</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-xl transition duration-200 shadow-md flex justify-center items-center gap-2">
                    <span>دخول المنصة</span>
                    <span>📖</span>
                </button>
            </form>
        </div>

        <!-- Register -->
        <div id="sectionRegister" class="hidden">
            <form onsubmit="handleRegister(event)" class="space-y-3.5">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">اسم الطالب رباعي</label>
                    <input type="text" id="regName" required placeholder="أدخل الاسم كاملاً" class="w-full px-3.5 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">رقم هاتف الطالب</label>
                    <input type="tel" id="regPhone" pattern="^01[0125][0-9]{8}$" required placeholder="01xxxxxxxxx" class="w-full px-3.5 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:outline-none text-left text-sm" dir="ltr">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">رقم هاتف ولي الأمر</label>
                    <input type="tel" id="regParentPhone" pattern="^01[0125][0-9]{8}$" required placeholder="01xxxxxxxxx" class="w-full px-3.5 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:outline-none text-left text-sm" dir="ltr">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">الصف الدراسي</label>
                    <select id="regGrade" required class="w-full px-3.5 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:outline-none bg-white text-sm">
                        <option value="">اختر الصف الدراسي...</option>
                        <optgroup label="مرحلة الأطفال والبراعم">
                            <option value="مرحلة الأطفال والبراعم">مرحلة الأطفال والبراعم</option>
                        </optgroup>
                        <optgroup label="المرحلة الابتدائية">
                            <option value="الصف الأول الابتدائي">الصف الأول الابتدائي</option>
                            <option value="الصف الثاني الابتدائي">الصف الثاني الابتدائي</option>
                            <option value="الصف الثالث الابتدائي">الصف الثالث الابتدائي</option>
                            <option value="الصف الرابع الابتدائي">الصف الرابع الابتدائي</option>
                            <option value="الصف الخامس الابتدائي">الصف الخامس الابتدائي</option>
                            <option value="الصف السادس الابتدائي">الصف السادس الابتدائي</option>
                        </optgroup>
                        <optgroup label="المرحلة الإعدادية">
                            <option value="الصف الأول الإعدادي">الصف الأول الإعدادي</option>
                            <option value="الصف الثاني الإعدادي">الصف الثاني الإعدادي</option>
                            <option value="الصف الثالث الإعدادي">الصف الثالث الإعدادي</option>
                        </optgroup>
                        <optgroup label="المرحلة الثانوية">
                            <option value="الصف الأول الثانوي">الصف الأول الثانوي</option>
                            <option value="الصف الثاني الثانوي">الصف الثاني الثانوي</option>
                            <option value="الصف الثالث الثانوي">الصف الثالث الثانوي</option>
                        </optgroup>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">كلمة السر</label>
                    <input type="password" id="regPassword" required minlength="4" placeholder="كلمة سر للحساب" class="w-full px-3.5 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:outline-none text-sm">
                </div>
                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-xl transition duration-200 shadow-md text-sm">
                    إنشاء الحساب والدخول ✨
                </button>
            </form>
        </div>

        <!-- Student Dashboard -->
        <div id="studentDashboard" class="hidden space-y-5">
            <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-xl flex justify-between items-center">
                <div>
                    <h2 class="text-base font-bold text-emerald-950" id="dashStudentName">مرحباً بك</h2>
                    <p class="text-xs text-emerald-700 font-semibold" id="dashStudentGrade"></p>
                </div>
                <button onclick="logoutStudent()" class="text-xs bg-white hover:bg-red-50 text-red-600 border border-red-200 font-bold px-3 py-1.5 rounded-lg transition shadow-sm">
                    تسجيل الخروج ↪️
                </button>
            </div>

            <div>
                <h3 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-1.5">
                    <span>📜</span>
                    <span>الامتحانات المتاحة القادمة</span>
                </h3>
                <div id="upcomingExamsContainer"></div>
            </div>

            <div class="border-t pt-4">
                <h3 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-1.5">
                    <span>📊</span>
                    <span>سجل الامتحانات والنتائج</span>
                </h3>
                <div id="previousExamsContainer" class="space-y-2"></div>
            </div>
        </div>

        <!-- Exam Screen -->
        <div id="step-exam" class="hidden">
            <div class="border-b pb-3 mb-4 flex justify-between items-center">
                <div>
                    <h2 class="text-base font-bold text-emerald-900" id="examSubjectTitle">الاختبار</h2>
                    <p class="text-xs text-slate-500 font-semibold" id="studentHeaderName"></p>
                </div>
                <div class="text-left">
                    <span class="text-xs font-bold bg-amber-100 text-amber-900 px-2.5 py-1 rounded-md border border-amber-300" id="examTimerDisplay">⏱️ --:--</span>
                </div>
            </div>

            <form onsubmit="submitExam(event)" class="space-y-4">
                <div id="examQuestionsContainer"></div>
                <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-xl transition duration-200 shadow-md">
                    تسليم ونهاية الاختبار 📤
                </button>
            </form>
        </div>

        <div class="mt-6 pt-4 border-t border-slate-100 text-center">
            <p class="text-xs font-semibold text-slate-500 mb-2">هل تحتاج لمساعدة؟</p>
            <div class="flex gap-2 justify-center">
                <a href="https://wa.me/201285227475" target="_blank" class="inline-flex items-center gap-1.5 bg-emerald-600 text-white text-xs font-bold px-3 py-2 rounded-lg shadow-sm">💬 التواصل عبر الواتساب</a>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="mt-6 text-center pb-2 relative">
        <p class="text-xs text-slate-400">دار الرحمان لتحفيظ القرآن الكريم © 2026</p>
        <a href="teacher.html" title="لوحة المعلم" class="fixed bottom-3 left-3 bg-slate-200/80 hover:bg-amber-600 text-slate-500 hover:text-white p-2 rounded-full shadow-md transition duration-200 text-xs border border-slate-300 flex items-center justify-center">
            🔒
        </a>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        let timerInterval = null;
        let currentExamQuestions = [];

        window.addEventListener('DOMContentLoaded', () => {
            const currentStudent = JSON.parse(localStorage.getItem('currentStudent'));
            if (currentStudent) {
                showDashboard(currentStudent);
            }
        });

        function switchAuthMode(mode) {
            if (mode === 'login') {
                document.getElementById('sectionLogin').classList.remove('hidden');
                document.getElementById('sectionRegister').classList.add('hidden');
                document.getElementById('tabLoginBtn').className = "flex-1 py-2.5 text-center font-bold text-emerald-700 border-b-2 border-emerald-600 transition text-sm sm:text-base";
                document.getElementById('tabRegisterBtn').className = "flex-1 py-2.5 text-center font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition text-sm sm:text-base";
            } else {
                document.getElementById('sectionLogin').classList.add('hidden');
                document.getElementById('sectionRegister').classList.remove('hidden');
                document.getElementById('tabRegisterBtn').className = "flex-1 py-2.5 text-center font-bold text-emerald-700 border-b-2 border-emerald-600 transition text-sm sm:text-base";
                document.getElementById('tabLoginBtn').className = "flex-1 py-2.5 text-center font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition text-sm sm:text-base";
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            const phone = document.getElementById('regPhone').value.trim();

            const newStudent = {
                name: document.getElementById('regName').value,
                phone: phone,
                parentPhone: document.getElementById('regParentPhone').value,
                grade: document.getElementById('regGrade').value,
                password: document.getElementById('regPassword').value
            };

            // حفظ في Firebase سحابياً
            if (window.saveStudentToFirebase) {
                await window.saveStudentToFirebase(newStudent);
            }

            localStorage.setItem('currentStudent', JSON.stringify(newStudent));
            showDashboard(newStudent);
        }

        async function handleLogin(event) {
            event.preventDefault();
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value;

            // التحقق والتحميل من Firebase
            if (window.getStudentFromFirebase) {
                const student = await window.getStudentFromFirebase(phone, password);
                if (student) {
                    localStorage.setItem('currentStudent', JSON.stringify(student));
                    showDashboard(student);
                } else {
                    alert("❌ رقم الهاتف أو كلمة السر غير صحيحة!");
                }
            }
        }

        function showDashboard(studentData) {
            document.getElementById('authTabs').classList.add('hidden');
            document.getElementById('sectionLogin').classList.add('hidden');
            document.getElementById('sectionRegister').classList.add('hidden');
            document.getElementById('step-exam').classList.add('hidden');
            document.getElementById('studentDashboard').classList.remove('hidden');

            document.getElementById('dashStudentName').innerText = "أهلاً بك، " + studentData.name;
            document.getElementById('dashStudentGrade').innerText = studentData.grade;

            renderDashboardData(studentData);
        }

        async function renderDashboardData(studentData) {
            let gradeExams = [];
            if (window.getExamsFromFirebase) {
                gradeExams = await window.getExamsFromFirebase(studentData.grade);
            }

            const upcomingContainer = document.getElementById('upcomingExamsContainer');

            if (gradeExams.length === 0) {
                upcomingContainer.innerHTML = `<div class="bg-slate-50 border border-slate-200 p-4 rounded-xl text-center text-xs text-slate-500">لا توجد امتحانات مضافة حالياً لصفك الدراسي.</div>`;
            } else {
                upcomingContainer.innerHTML = gradeExams.map(exam => `
                    <div class="bg-emerald-50/70 border border-emerald-200 p-3.5 rounded-xl flex justify-between items-center mb-2 shadow-sm">
                        <div>
                            <h4 class="font-bold text-slate-800 text-xs sm:text-sm">${exam.subject}</h4>
                            <p class="text-[11px] text-slate-500 mt-0.5">⏱️ المدة: ${exam.duration} دقيقة | 📝 ${exam.questions.length} أسئلة</p>
                        </div>
                        <button onclick="startExam('${exam.id}')" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs px-3 py-2 rounded-lg transition shadow">
                            بدء الاختبار 📝
                        </button>
                    </div>
                `).join('');
            }
        }

        function logoutStudent() {
            if (confirm("هل تريد تسجيل الخروج؟")) {
                localStorage.removeItem('currentStudent');
                location.reload();
            }
        }
    </script>

    <!-- Firebase SDK & Database Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOpetcxMlTHXmK-A8L9qkA2LqZ7cur7pU",
            authDomain: "dar-alrhman.firebaseapp.com",
            databaseURL: "https://dar-alrhman-default-rtdb.firebaseio.com",
            projectId: "dar-alrhman",
            storageBucket: "dar-alrhman.firebasestorage.app",
            messagingSenderId: "626775344339",
            appId: "1:626775344339:web:f0ade6c34533726dd9c026"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. حفظ طالب جديد في الفايربيز
        window.saveStudentToFirebase = async function(studentData) {
            try {
                await addDoc(collection(db, "students"), {
                    ...studentData,
                    createdAt: new Date().toISOString()
                });
            } catch (e) {
                console.error("خطأ أثناء الحفظ: ", e);
            }
        };

        // 2. تسجيل دخول الطالب من الفايربيز
        window.getStudentFromFirebase = async function(phone, password) {
            try {
                const q = query(collection(db, "students"), where("phone", "==", phone), where("password", "==", password));
                const querySnapshot = await getDocs(q);
                if (!querySnapshot.empty) {
                    return querySnapshot.docs[0].data();
                }
                return null;
            } catch (e) {
                console.error("خطأ تسجيل الدخول: ", e);
                return null;
            }
        };

        // 3. قراءة الامتحانات الخاصة بصف الطالب من الفايربيز
        window.getExamsFromFirebase = async function(grade) {
            try {
                const q = query(collection(db, "exams"), where("grade", "==", grade));
                const querySnapshot = await getDocs(q);
                const exams = [];
                querySnapshot.forEach((doc) => {
                    exams.push({ id: doc.id, ...doc.data() });
                });
                return exams;
            } catch (e) {
                return [];
            }
        };
    </script>
</body>
</html>
